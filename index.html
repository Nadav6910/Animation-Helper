<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c5cff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Animation" />
    <title>Animation Helper — design CSS animations visually</title>
    <meta
      name="description"
      content="Visually design CSS animations and copy production-ready code in 12 formats — CSS, Tailwind, Framer Motion, WAAPI, Vue, Svelte, Lottie, animated SVG, MP4 / WebM / GIF."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Async font load: `media="print"` makes the stylesheet non-render-
      blocking; the onload handler swaps it back to `all` once it's
      downloaded. The <noscript> fallback gives no-JS users the same
      sync load they'd get without this trick. font-display:swap (in
      the URL) means text paints in the system fallback first and
      re-renders once Inter / JetBrains Mono / Sansita Swashed are
      ready, so the FCP / LCP land before the network fonts arrive.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sansita+Swashed:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sansita+Swashed:wght@600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
