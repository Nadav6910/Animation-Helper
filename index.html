<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c5cff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Animation" />
    <title>Animation Helper — design CSS animations visually</title>
    <meta
      name="description"
      content="Visually design CSS animations and copy production-ready code in 12 formats — CSS, Tailwind, Framer Motion, WAAPI, Vue, Svelte, Lottie, animated SVG, MP4 / WebM / GIF."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Async font load that is also CSP-safe.
      `media="print"` keeps the stylesheet OFF the critical render
      path — browsers fetch but don't block screen rendering on
      `print`-media CSS. main.tsx then flips `media` to `all` once
      our bundle starts executing. The previous version did the
      swap via `onload="this.media='all'"`, which is an inline event
      handler that our CSP rightly rejects (`script-src 'self'`, no
      inline handlers); doing the swap from inside our bundled JS
      gets the same non-blocking behaviour without violating CSP.
      The earlier "drop the trick entirely" version satisfied CSP
      but cost ~0.5 s of FCP / 1.5 s of LCP because the stylesheet
      went back on the critical path. The <noscript> fallback gives
      no-JS users a normal sync load. font-display:swap (in the URL)
      keeps text rendering even if the network call is slow.
    -->
    <link
      id="ah-font-css"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sansita+Swashed:wght@600;700&display=swap"
      media="print"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sansita+Swashed:wght@600;700&display=swap"
      />
    </noscript>
    <!--
      Inline splash so the LCP element (the title) paints during HTML
      parsing, before any JS executes. With Lighthouse's throttled
      mobile profile the React + LoadingScreen path doesn't paint
      anything for 3+ seconds; the inline splash drops FCP / LCP into
      the sub-second range. The React app's <createRoot> later
      replaces #root's children, so this is purely a first-paint
      stand-in. System-font stack so we don't wait on Google Fonts.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0c0d12;
        color: #e9e9ee;
        /* Belt-and-suspenders against iOS Safari making the page
           scroll because of a min-height that overflows the visible
           area when the URL bar is collapsed/expanded. The mobile
           sheet provides its own vertical adjustment, so the body
           itself never needs to scroll. */
        overflow: hidden;
        height: 100%;
      }
      #root {
        /* `100vh` first as a fallback, `100dvh` second as the
           override on browsers that support it. Order matters:
           the LAST valid declaration wins. Putting `vh` last meant
           even iOS Safari (which supports `dvh`) ended up using
           the static viewport — taller than what's actually
           visible while the URL bar is up — and the page scrolled
           vertically. The mobile sheet handles content overflow on
           its own; the document never needs to scroll. */
        min-height: 100vh;
        min-height: 100dvh;
        height: 100vh;
        height: 100dvh;
      }
      .ah-pre-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(60% 60% at 50% 45%, rgba(124, 92, 255, 0.18), transparent 70%),
          radial-gradient(40% 50% at 50% 100%, rgba(124, 92, 255, 0.1), transparent 70%);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        text-align: center;
      }
      .ah-pre-splash h1 {
        margin: 0;
        font-size: clamp(1.875rem, 5vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #7c5cff 0%, #ec4899 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .ah-pre-splash p {
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ah-pre-splash" aria-hidden="true">
        <div>
          <h1>Animation Helper</h1>
          <p>Crafting motion…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
